  LEGACY BUILD for the Reserva / Onelan NTB player (NTB 11.x, WebKit 531).
  That browser is Safari 4 era, so this file avoids everything it cannot handle:
  no fetch, no promises, no arrow functions or template literals, no Map or
  Object.entries, no CSS variables, flexbox or grid, no inline SVG and no web

  positioning in pixels, and the chart is built from plain divs.

  Note: the API client id and secret are in plain text below. Anyone who can
  open or view-source this file can read the estate's sensor data.
-->

<script type="text/javascript">
var CLIENT_ID     = "d5b3d738-f09c-4f89-8939-ab595b334cf0";
var CLIENT_SECRET = "9f705a28-a3a9-4c64-b6a2-eec50f22a3db";
var LOCATION_ID   = "b4f76c61-c100-4828-ae78-999027fbaf73";

/* Fallback for players that cannot call the Airthings API directly.
   Point this at rcp-airthings-monitor.php on your own server, for example
   "http://spine-server/airthings/rcp-airthings-monitor.php", and this screen
   reads from there instead. Leave blank to talk to Airthings direct. */
var DATA_URL = "";

/* Clock. LONDON_TIME ignores the player's timezone and shows London wall time,
   including the British Summer Time changeover. CLOCK_OFFSET_MINUTES corrects a
   player whose own clock is running wrong; leave at 0 if it uses NTP. */
var LONDON_TIME = true;
var CLOCK_OFFSET_MINUTES = 0;

/* The headline metric shown large on every screen. Change to "co2", "humidity",
   "voc", "pm25" or any other key in the METRICS list below. */
var HERO_KEY = "temp";

var CHART_W = 1050;           /* trend chart size in pixels */
var CHART_H = 420;

var REFRESH_MS   = 300000;   /* five minutes */
var REQUEST_MS   = 20000;    /* give up on a request after twenty seconds */
var RELOAD_HOURS = 6;

/* The average of every sensor on Level 10. */
var FLOOR_LABEL = "Level 10";
var SERIALS = ["2969002872", "2969002909", "2969002772", "2969002769", "2969002883"];

var DEVICES = [
  { s: "2969002872", n: "L10 breakout area", f: "Level 10" },
  { s: "2969002909", n: "Meeting pod/Coat rail area L10", f: "Level 10" },
  { s: "2969002772", n: "Outside meeting rooms", f: "Level 10" },
  { s: "2969002769", n: "UOL outside small office", f: "Level 10" },
  { s: "2969002883", n: "Workspace - Side B (near printer)", f: "Level 10" }
];

/* =========================================================================
 * POLYFILLS - WebKit 531 predates most of ES5
 * ====================================================================== */
if (!Array.prototype.indexOf) {
  Array.prototype.indexOf = function (item) {
    for (var i = 0; i < this.length; i++) { if (this[i] === item) { return i; } }
    return -1;
  };
}
if (!Array.prototype.forEach) {
  Array.prototype.forEach = function (fn) {
    for (var i = 0; i < this.length; i++) { fn(this[i], i, this); }
  };
}
if (!Object.keys) {
  Object.keys = function (obj) {
    var out = [], k;
    for (k in obj) { if (Object.prototype.hasOwnProperty.call(obj, k)) { out.push(k); } }
    return out;
  };
}
if (!Date.now) { Date.now = function () { return new Date().getTime(); }; }

/* =========================================================================
 * METRICS
 * bands: lower is better. window: middle is best. up: higher is better.
 * ====================================================================== */
var METRICS = [
  { k: "co2",      label: "CO2",         unit: "ppm",   dp: 0, bands: [800, 1000] },
  { k: "temp",     label: "TEMPERATURE", unit: "&deg;C", dp: 1, window: [18, 25, 16, 27] },
  { k: "humidity", label: "HUMIDITY",    unit: "%",     dp: 0, window: [30, 60, 25, 70] },
  { k: "voc",      label: "VOC",         unit: "ppb",   dp: 0, bands: [250, 2000] },
  { k: "pm25",     label: "PM2.5",       unit: "&micro;g/m&sup3;", dp: 1, bands: [10, 25] },
  { k: "pm1",      label: "PM1",         unit: "&micro;g/m&sup3;", dp: 1, bands: [10, 25] },
  { k: "pm10",     label: "PM10",        unit: "&micro;g/m&sup3;", dp: 1, bands: [25, 50] },
  { k: "sla",      label: "SOUND LEVEL", unit: "dBA",   dp: 0 },
  { k: "virusRisk", label: "VIRUS RISK", unit: "",      dp: 0, bands: [30, 60] },
  { k: "airExchangeRate", label: "AIR EXCHANGE", unit: "ACH", dp: 2 },
  { k: "pressure", label: "PRESSURE",    unit: "hPa",   dp: 0 },
  { k: "light",    label: "LIGHT LEVEL", unit: "",      dp: 0 },
  { k: "battery",  label: "BATTERY",     unit: "%",     dp: 0, up: [20, 10] }
];

function metricFor(key) {
  for (var i = 0; i < METRICS.length; i++) { if (METRICS[i].k === key) { return METRICS[i]; } }
  return null;
}

function statusOf(key, value) {
  var m = metricFor(key);
  if (!m || value === null || value === undefined) { return ""; }
  var v = Number(value);
  if (isNaN(v)) { return ""; }
  if (m.bands) { return v <= m.bands[0] ? "good" : (v <= m.bands[1] ? "fair" : "poor"); }
  if (m.window) {
    if (v >= m.window[0] && v <= m.window[1]) { return "good"; }
    if (v >= m.window[2] && v <= m.window[3]) { return "fair"; }
    return "poor";
  }
  if (m.up) { return v >= m.up[0] ? "good" : (v >= m.up[1] ? "fair" : "poor"); }
  return "";
}

function worstOf(data) {
  var order = { "": 0, good: 1, fair: 2, poor: 3 };
  var worst = "";
  for (var i = 0; i < METRICS.length; i++) {
    var k = METRICS[i].k;
    if (k === "battery") { continue; }
    var s = statusOf(k, data[k]);
    if (order[s] > order[worst]) { worst = s; }
  }
  return worst;
}

function toneOf(state) {
  return state === "poor" ? "poor" : (state === "fair" ? "fair" : (state === "good" ? "good" : "dorm"));
}

function colourOf(state) {
  return state === "poor" ? "#ff9862" : (state === "fair" ? "#ffcc53" : "#59d8a1");
}

function wordOf(state, stale) {
  if (stale) { return "No recent data"; }
  return state === "poor" ? "Action" : (state === "fair" ? "Watch" : "Within guidance");
}

function fmt(value, m) {
  if (value === null || value === undefined || value === "") { return "\u2013"; }
  var v = Number(value);
  if (isNaN(v)) { return "\u2013"; }
  var dp = m ? m.dp : 1;
  if (v.toFixed) { return v.toFixed(dp); }
  return "" + v;
}

function ago(seconds) {
  if (seconds === null) { return "no reading"; }
  if (seconds < 90) { return "just now"; }
  if (seconds < 3600) { return Math.round(seconds / 60) + " min ago"; }
  if (seconds < 86400) { return Math.round(seconds / 3600) + " h ago"; }
  return Math.round(seconds / 86400) + " d ago";
}

function pad2(n) { return n < 10 ? "0" + n : "" + n; }

/* =========================================================================
 * LONDON TIME
 * The player's own timezone setting is ignored. Everything is worked out from
 * UTC, then British Summer Time is added between 01:00 UTC on the last Sunday
 * in March and 01:00 UTC on the last Sunday in October. Set
 * CLOCK_OFFSET_MINUTES if the player's clock itself is running wrong.
 * ====================================================================== */
var DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
var MONTH_NAMES = ["January", "February", "March", "April", "May", "June",
                   "July", "August", "September", "October", "November", "December"];

function nowMs() { return (new Date()).getTime() + CLOCK_OFFSET_MINUTES * 60000; }
function nowSeconds() { return Math.floor(nowMs() / 1000); }

/** Date of the last Sunday in a month, month being 0 for January. */
function lastSundayOfMonth(year, month) {
  var lastDay = new Date(Date.UTC(year, month + 1, 0));
  return lastDay.getUTCDate() - lastDay.getUTCDay();
}

/** Minutes to add to UTC for London: 60 during British Summer Time, otherwise 0. */
function londonOffsetMinutes(utcMillis) {
  var d = new Date(utcMillis);
  var year = d.getUTCFullYear();
  var starts = Date.UTC(year, 2, lastSundayOfMonth(year, 2), 1, 0, 0);
  var ends = Date.UTC(year, 9, lastSundayOfMonth(year, 9), 1, 0, 0);
  return (utcMillis >= starts && utcMillis < ends) ? 60 : 0;
}

/** London wall clock, read through the UTC getters of a shifted date. */
function londonDate() {
  var utc = nowMs();
  return new Date(utc + londonOffsetMinutes(utc) * 60000);
}

function londonTimeText() {
  var d = londonDate();
  return pad2(d.getUTCHours()) + ":" + pad2(d.getUTCMinutes());
}

function londonDateText() {
  var d = londonDate();
  return DAY_NAMES[d.getUTCDay()] + " " + d.getUTCDate() + " " +
    MONTH_NAMES[d.getUTCMonth()] + " " + d.getUTCFullYear();
}

/** GMT or BST, for the label beside the clock. */
function londonZoneText() {
  return londonOffsetMinutes(nowMs()) ? "BST" : "GMT";
}
function byId(id) { return document.getElementById(id); }

function nameOf(serial) {
  for (var i = 0; i < DEVICES.length; i++) {
    if (DEVICES[i].s === serial) { return DEVICES[i].n; }
  }
  return serial;
}

/* =========================================================================
 * REQUESTS - XMLHttpRequest with callbacks and our own timeout
 * ====================================================================== */
function request(method, url, body, auth, done) {
  var xhr = new XMLHttpRequest();
  var finished = false;

  var timer = setTimeout(function () {
    if (finished) { return; }
    finished = true;
    try { xhr.abort(); } catch (e) {}
    done("The request timed out", null);
  }, REQUEST_MS);

  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4 || finished) { return; }
    finished = true;
    clearTimeout(timer);
    if (xhr.status < 200 || xhr.status >= 300) {
      done("HTTP " + (xhr.status || "0, no response") + " from " + url, null);
      return;
    }
    var parsed;
    try { parsed = eval("(" + xhr.responseText + ")"); }
    catch (e) { done("The response was not readable JSON", null); return; }
    done(null, parsed);
  };

  try {
    xhr.open(method, url, true);
    if (body) { xhr.setRequestHeader("Content-Type", "application/json"); }
    if (auth) { xhr.setRequestHeader("Authorization", "Bearer " + auth); }
    xhr.send(body ? body : null);
  } catch (e) {
    if (!finished) {
      finished = true;
      clearTimeout(timer);
      done("The browser refused the request: " + e, null);
    }
  }
}

var token = null;
var tokenExpires = 0;

function withToken(done) {
  if (DATA_URL) { done(null, null); return; }
  if (token && tokenExpires > Date.now() + 60000) { done(null, token); return; }
  var body = '{"grant_type":"client_credentials","client_id":"' + CLIENT_ID +
    '","client_secret":"' + CLIENT_SECRET + '","scope":["read:device"]}';
  request("POST", "https://accounts-api.airthings.com/v1/token", body, null, function (err, data) {
    if (err) { done("Sign in failed. " + err, null); return; }
    if (!data || !data.access_token) { done("Sign in returned no token", null); return; }
    token = data.access_token;
    tokenExpires = Date.now() + (data.expires_in ? data.expires_in * 1000 : 3600000);
    done(null, token);
  });
}

/**
 * Current readings for every sensor this screen cares about.
 * One request covers the whole building, either from Airthings or from the
 * PHP endpoint when DATA_URL is set.
 */
function loadReadings(done) {
  if (DATA_URL) {
    request("GET", DATA_URL + "?api=latest", null, null, function (err, payload) {
      if (err) { done(err, null); return; }
      if (!payload || !payload.rooms) { done("The server sent no readings", null); return; }
      var out = [];
      for (var i = 0; i < payload.rooms.length; i++) {
        var room = payload.rooms[i];
        if (SERIALS.indexOf(room.serial) < 0) { continue; }
        out.push({ serial: room.serial, name: nameOf(room.serial), data: room.data || {} });
      }
      done(null, out);
    });
    return;
  }
  withToken(function (err, tok) {
    if (err) { done(err, null); return; }
    request("GET", "https://ext-api.airthings.com/v1/locations/" + LOCATION_ID + "/latest-samples",
      null, tok, function (err2, payload) {
        if (err2) { done(err2, null); return; }
        if (!payload || !payload.devices) { done("The API sent no devices", null); return; }
        var out = [];
        for (var i = 0; i < payload.devices.length; i++) {
          var dev = payload.devices[i];
          if (SERIALS.indexOf(dev.id) < 0) { continue; }
          out.push({ serial: dev.id, name: nameOf(dev.id), data: dev.data || {} });
        }
        done(null, out);
      });
  });
}

/** Twenty four hours of history for one sensor. */
function loadHistory(serial, done) {
  if (DATA_URL) {
    request("GET", DATA_URL + "?api=history&serial=" + serial + "&hours=24", null, null,
      function (err, payload) {
        if (err) { done(err, null); return; }
        done(null, payload && payload.data ? payload.data : null);
      });
    return;
  }
  var to = nowSeconds();
  var from = to - 86400;
  withToken(function (err, tok) {
    if (err) { done(err, null); return; }
    request("GET", "https://ext-api.airthings.com/v1/devices/" + serial +
      "/samples?start=" + from + "&end=" + to, null, tok, function (err2, payload) {
        if (err2) { done(err2, null); return; }
        done(null, payload && payload.data ? payload.data : null);
      });
  });
}

/** History for several sensors, one after another so the player is never flooded. */
function loadHistories(serials, done) {
  var results = [];
  var index = 0;
  function next() {
    if (index >= serials.length) { done(results); return; }
    var serial = serials[index];
    index++;
    loadHistory(serial, function (err, data) {
      if (!err && data) { results.push(data); }
      next();
    });
  }
  next();
}

/* =========================================================================
 * CHART - a row of absolutely positioned divs, so no SVG is needed
 * ====================================================================== */
var CHART_COLUMNS = 100;

/** Reduce one or more sample series to a fixed number of averaged columns. */
function bucket(seriesList, key) {
  var columns = [];
  var c;
  for (c = 0; c < CHART_COLUMNS; c++) { columns.push({ sum: 0, count: 0 }); }

  for (var s = 0; s < seriesList.length; s++) {
    var values = seriesList[s] ? seriesList[s][key] : null;
    if (!values || !values.length) { continue; }
    var clean = [];
    for (var i = 0; i < values.length; i++) {
      if (values[i] === null || values[i] === undefined) { continue; }
      var v = Number(values[i]);
      if (!isNaN(v)) { clean.push(v); }
    }
    if (!clean.length) { continue; }
    var step = clean.length / CHART_COLUMNS;
    for (c = 0; c < CHART_COLUMNS; c++) {
      var start = Math.floor(c * step);
      var end = Math.floor((c + 1) * step);
      if (end <= start) { end = start + 1; }
      for (var p = start; p < end && p < clean.length; p++) {
        columns[c].sum += clean[p];
        columns[c].count++;
      }
    }
  }

  var out = [];
  for (c = 0; c < CHART_COLUMNS; c++) {
    out.push(columns[c].count ? columns[c].sum / columns[c].count : null);
  }
  return out;
}

/** Paint bucketed values into a chart div of the given pixel size. */
function paintBars(elementId, values, key, width, height) {
  var box = byId(elementId);
  if (!box) { return null; }
  var present = [];
  var i;
  for (i = 0; i < values.length; i++) { if (values[i] !== null) { present.push(values[i]); } }
  if (!present.length) { box.innerHTML = ""; return null; }

  var low = present[0], high = present[0], total = 0;
  for (i = 0; i < present.length; i++) {
    if (present[i] < low) { low = present[i]; }
    if (present[i] > high) { high = present[i]; }
    total += present[i];
  }
  var span = high - low;
  if (span < 1) { span = 1; }

  var barWidth = Math.floor(width / values.length);
  if (barWidth < 2) { barWidth = 2; }
  var gap = Math.floor(width / values.length);
  var html = "";
  for (i = 0; i < values.length; i++) {
    if (values[i] === null) { continue; }
    var barHeight = Math.round(((values[i] - low) / span) * (height - 18)) + 4;
    html += '<div class="bar" style="left:' + (i * gap) + "px;width:" + (barWidth - 2) +
      "px;height:" + barHeight + "px;background:" + colourOf(statusOf(key, values[i])) + ';"></div>';
  }
  box.innerHTML = html;
  return { low: low, high: high, average: total / present.length, count: present.length };
}


/* =========================================================================
 * FLOOR AVERAGE SCREEN
 * Averages every sensor on one level, with a per-space list underneath.
 * ====================================================================== */
/* HERO_KEY comes from the config block at the top of the file. Every metric
   other than the headline one fills the tiles, in this order. */
var TILE_ORDER = ["co2", "temp", "humidity", "voc", "pm25", "sla", "airExchangeRate"];

function tileKeys() {
  var out = [];
  for (var i = 0; i < TILE_ORDER.length && out.length < 6; i++) {
    if (TILE_ORDER[i] !== HERO_KEY) { out.push(TILE_ORDER[i]); }
  }
  return out;
}
var TILE_KEYS = tileKeys();

var failures = 0;
var lastReadingAt = 0;

function showAlert(message) {
  var box = byId("alert");
  if (!message) { box.style.display = "none"; box.innerHTML = ""; return; }
  box.innerHTML = message;
  box.style.display = "block";
}

/** Mean of one metric across the spaces that report it. */
function averageOf(rooms, key) {
  var sum = 0, count = 0;
  for (var i = 0; i < rooms.length; i++) {
    var v = rooms[i].data ? rooms[i].data[key] : null;
    if (v === null || v === undefined) { continue; }
    var n = Number(v);
    if (isNaN(n)) { continue; }
    sum += n; count++;
  }
  return count ? { value: sum / count, count: count } : { value: null, count: 0 };
}

function tickClock() {
  if (LONDON_TIME) {
    byId("clock").innerHTML = londonTimeText();
    if (byId("date")) {
      byId("date").innerHTML = londonDateText() + " &middot; " + londonZoneText();
    }
  } else {
    var now = new Date();
    byId("clock").innerHTML = pad2(now.getHours()) + ":" + pad2(now.getMinutes());
  }
  if (lastReadingAt) {
    byId("live").innerHTML = "Live from Airthings &middot; <b>" +
      ago(Math.floor((nowMs() - lastReadingAt) / 1000)) + "</b>";
  }
}

function paintRooms(rooms) {
  var heroMetric = metricFor(HERO_KEY);
  var hero = averageOf(rooms, HERO_KEY);

  byId("heroValue").innerHTML = fmt(hero.value, heroMetric) +
    ' <span class="u">' + heroMetric.unit + "</span>";
  byId("heroValue").className = statusOf(HERO_KEY, hero.value);
  byId("heroLabel").innerHTML = "AVERAGE " + heroMetric.label + ", LAST 24 HOURS";

  /* Oldest reading on the floor, and how the floor is doing overall. */
  var oldest = null, flagged = 0, quiet = 0, i;
  var order = { "": 0, good: 1, fair: 2, poor: 3 };
  var worst = "";
  for (i = 0; i < rooms.length; i++) {
    var data = rooms[i].data || {};
    var age = data.time ? nowSeconds() - data.time : null;
    if (age === null || age > 1200) { quiet++; }
    if (age !== null && (oldest === null || age > oldest)) { oldest = age; }
    var state = worstOf(data);
    if (state === "fair" || state === "poor") { flagged++; }
    if (order[state] > order[worst]) { worst = state; }
  }

  var stale = (quiet === rooms.length);
  byId("stateWord").innerHTML = wordOf(worst, stale);
  byId("stateWord").className = stale ? "dorm" : toneOf(worst);
  byId("roomMeta").innerHTML = rooms.length + (rooms.length === 1 ? " space" : " spaces") +
    " &middot; " + (flagged ? flagged + " needing attention" : "all within guidance") +
    (quiet ? " &middot; " + quiet + " not reporting" : "");
  byId("footRight").innerHTML = "Averaged from " + rooms.length +
    (rooms.length === 1 ? " sensor" : " sensors") + " &middot; oldest reading " + ago(oldest);

  /* Averages for the supporting tiles. */
  for (i = 0; i < TILE_KEYS.length; i++) {
    var key = TILE_KEYS[i];
    var m = metricFor(key);
    var avg = averageOf(rooms, key);
    var tile = byId("tile" + i);
    if (avg.value === null) { tile.style.display = "none"; continue; }
    tile.innerHTML = '<div class="tileLab">' + m.label + " AVERAGE</div>" +
      '<div class="tileVal ' + statusOf(key, avg.value) + '">' + fmt(avg.value, m) +
      (m.unit ? ' <span class="tileUnit">' + m.unit + "</span>" : "") + "</div>";
    tile.style.display = "block";
  }

}

function paintAverageChart(histories) {
  var stats = paintBars("chart", bucket(histories, HERO_KEY), HERO_KEY, CHART_W, CHART_H);
  var m = metricFor(HERO_KEY);
  if (!stats) { byId("heroStats").innerHTML = "History unavailable"; return; }
  byId("heroStats").innerHTML = "low " + fmt(stats.low, m) + "&nbsp;&nbsp;high " + fmt(stats.high, m) +
    "&nbsp;&nbsp;average " + fmt(stats.average, m) + "&nbsp;&nbsp;from " + histories.length +
    (histories.length === 1 ? " sensor" : " sensors");
}

/** Put the spaces in the order they are listed in DEVICES, so the list is stable. */
function inDeviceOrder(list) {
  var out = [];
  for (var d = 0; d < DEVICES.length; d++) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].serial === DEVICES[d].s) { out.push(list[i]); }
    }
  }
  return out;
}

function refresh() {
  loadReadings(function (err, incoming) {
    if (err || !incoming || !incoming.length) {
      failures++;
      var wait = Math.min(120, 15 * failures);
      showAlert("No data from Airthings: " + (err || "no sensors returned for this floor") +
        ". Retrying in " + wait + " seconds.");
      setTimeout(refresh, wait * 1000);
      return;
    }
    failures = 0;
    showAlert("");
    lastReadingAt = nowMs();
    var rooms = inDeviceOrder(incoming);
    paintRooms(rooms);

    var serials = [];
    for (var i = 0; i < rooms.length; i++) { serials.push(rooms[i].serial); }
    loadHistories(serials, function (histories) {
      if (histories.length) { paintAverageChart(histories); }
      else { byId("heroStats").innerHTML = "History unavailable"; }
      setTimeout(refresh, REFRESH_MS);
    });
  });
}

tickClock();
setInterval(tickClock, 1000);
refresh();

/* A screen left running for weeks benefits from an occasional clean start.
   The meta refresh in the head does the same job if scripting is interrupted. */
setTimeout(function () { window.location.reload(true); }, RELOAD_HOURS * 3600000);

</script>
</body>
</html>
