<!--
  Royal College of Physicians - Indoor Environment Monitor, wall display
  The Spine, Paddington Village.

  LEGACY BUILD for the Reserva / Onelan NTB player (NTB 11.x, WebKit 531).
  That browser is Safari 4 era, so this file avoids everything it cannot handle:
  no fetch, no promises, no arrow functions or template literals, no Map or
  Object.entries, no CSS variables, flexbox or grid, no inline SVG and no web
  fonts. Requests use XMLHttpRequest with callbacks, the layout is absolute
  positioning in pixels, and the chart is built from plain divs.

  Panel size: 1920 x 1080 landscape.

  Note: the API client id and secret are in plain text below. Anyone who can
  open or view-source this file can read the estate's sensor data.
-->

  Object.keys = function (obj) {
    var out = [], k;
    for (k in obj) { if (Object.prototype.hasOwnProperty.call(obj, k)) { out.push(k); } }
    return out;
  };
}
if (!Date.now) { Date.now = function () { return new Date().getTime(); }; }

/* =========================================================================
 * METRICS
 * bands: lower is better. window: middle is best. up: higher is better.
 * ====================================================================== */
var METRICS = [
  { k: "co2",      label: "CO2",         unit: "ppm",   dp: 0, bands: [800, 1000] },
  { k: "temp",     label: "TEMPERATURE", unit: "&deg;C", dp: 1, window: [18, 25, 16, 27] },
  { k: "humidity", label: "HUMIDITY",    unit: "%",     dp: 0, window: [30, 60, 25, 70] },
  { k: "voc",      label: "VOC",         unit: "ppb",   dp: 0, bands: [250, 2000] },
  { k: "pm25",     label: "PM2.5",       unit: "&micro;g/m&sup3;", dp: 1, bands: [10, 25] },
  { k: "pm1",      label: "PM1",         unit: "&micro;g/m&sup3;", dp: 1, bands: [10, 25] },
  { k: "pm10",     label: "PM10",        unit: "&micro;g/m&sup3;", dp: 1, bands: [25, 50] },
  { k: "sla",      label: "SOUND LEVEL", unit: "dBA",   dp: 0 },
  { k: "virusRisk", label: "VIRUS RISK", unit: "",      dp: 0, bands: [30, 60] },
  { k: "airExchangeRate", label: "AIR EXCHANGE", unit: "ACH", dp: 2 },
  { k: "pressure", label: "PRESSURE",    unit: "hPa",   dp: 0 },
  { k: "light",    label: "LIGHT LEVEL", unit: "",      dp: 0 },
  { k: "battery",  label: "BATTERY",     unit: "%",     dp: 0, up: [20, 10] }
];

function metricFor(key) {
  for (var i = 0; i < METRICS.length; i++) { if (METRICS[i].k === key) { return METRICS[i]; } }
  return null;
}

function statusOf(key, value) {
  var m = metricFor(key);
  if (!m || value === null || value === undefined) { return ""; }
  var v = Number(value);
  if (isNaN(v)) { return ""; }
  if (m.bands) { return v <= m.bands[0] ? "good" : (v <= m.bands[1] ? "fair" : "poor"); }
  if (m.window) {
    if (v >= m.window[0] && v <= m.window[1]) { return "good"; }
    if (v >= m.window[2] && v <= m.window[3]) { return "fair"; }
    return "poor";
  }
  if (m.up) { return v >= m.up[0] ? "good" : (v >= m.up[1] ? "fair" : "poor"); }
  return "";
}

function worstOf(data) {
  var order = { "": 0, good: 1, fair: 2, poor: 3 };
  var worst = "";
  for (var i = 0; i < METRICS.length; i++) {
    var k = METRICS[i].k;
    if (k === "battery") { continue; }
    var s = statusOf(k, data[k]);
    if (order[s] > order[worst]) { worst = s; }
  }
  return worst;
}

function toneOf(state) {
  return state === "poor" ? "poor" : (state === "fair" ? "fair" : (state === "good" ? "good" : "dorm"));
}

function colourOf(state) {
  return state === "poor" ? "#ff9862" : (state === "fair" ? "#ffcc53" : "#59d8a1");
}

function wordOf(state, stale) {
  if (stale) { return "No recent data"; }
  return state === "poor" ? "Action" : (state === "fair" ? "Watch" : "Within guidance");
}

function fmt(value, m) {
  if (value === null || value === undefined || value === "") { return "\u2013"; }
  var v = Number(value);
  if (isNaN(v)) { return "\u2013"; }
  var dp = m ? m.dp : 1;
  if (v.toFixed) { return v.toFixed(dp); }
  return "" + v;
}

function ago(seconds) {
  if (seconds === null) { return "no reading"; }
  if (seconds < 90) { return "just now"; }
  if (seconds < 3600) { return Math.round(seconds / 60) + " min ago"; }
  if (seconds < 86400) { return Math.round(seconds / 3600) + " h ago"; }
  return Math.round(seconds / 86400) + " d ago";
}

function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function byId(id) { return document.getElementById(id); }

function nameOf(serial) {
  for (var i = 0; i < DEVICES.length; i++) {
    if (DEVICES[i].s === serial) { return DEVICES[i].n; }
  }
  return serial;
}

/* =========================================================================
 * REQUESTS - XMLHttpRequest with callbacks and our own timeout
 * ====================================================================== */
function request(method, url, body, auth, done) {
  var xhr = new XMLHttpRequest();
  var finished = false;

  var timer = setTimeout(function () {
    if (finished) { return; }
    finished = true;
    try { xhr.abort(); } catch (e) {}
    done("The request timed out", null);
  }, REQUEST_MS);

  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4 || finished) { return; }
    finished = true;
    clearTimeout(timer);
    if (xhr.status < 200 || xhr.status >= 300) {
      done("HTTP " + (xhr.status || "0, no response") + " from " + url, null);
      return;
    }
    var parsed;
    try { parsed = eval("(" + xhr.responseText + ")"); }
    catch (e) { done("The response was not readable JSON", null); return; }
    done(null, parsed);
  };

  try {
    xhr.open(method, url, true);
    if (body) { xhr.setRequestHeader("Content-Type", "application/json"); }
    if (auth) { xhr.setRequestHeader("Authorization", "Bearer " + auth); }
    xhr.send(body ? body : null);
  } catch (e) {
    if (!finished) {
      finished = true;
      clearTimeout(timer);
      done("The browser refused the request: " + e, null);
    }
  }
}

var token = null;
var tokenExpires = 0;

function withToken(done) {
  if (DATA_URL) { done(null, null); return; }
  if (token && tokenExpires > Date.now() + 60000) { done(null, token); return; }
  var body = '{"grant_type":"client_credentials","client_id":"' + CLIENT_ID +
    '","client_secret":"' + CLIENT_SECRET + '","scope":["read:device"]}';
  request("POST", "https://accounts-api.airthings.com/v1/token", body, null, function (err, data) {
    if (err) { done("Sign in failed. " + err, null); return; }
    if (!data || !data.access_token) { done("Sign in returned no token", null); return; }
    token = data.access_token;
    tokenExpires = Date.now() + (data.expires_in ? data.expires_in * 1000 : 3600000);
    done(null, token);
  });
}

/**
 * Current readings for every sensor this screen cares about.
 * One request covers the whole building, either from Airthings or from the
 * PHP endpoint when DATA_URL is set.
 */
function loadReadings(done) {
  if (DATA_URL) {
    request("GET", DATA_URL + "?api=latest", null, null, function (err, payload) {
      if (err) { done(err, null); return; }
      if (!payload || !payload.rooms) { done("The server sent no readings", null); return; }
      var out = [];
      for (var i = 0; i < payload.rooms.length; i++) {
        var room = payload.rooms[i];
        if (SERIALS.indexOf(room.serial) < 0) { continue; }
        out.push({ serial: room.serial, name: nameOf(room.serial), data: room.data || {} });
      }
      done(null, out);
    });
    return;
  }
  withToken(function (err, tok) {
    if (err) { done(err, null); return; }
    request("GET", "https://ext-api.airthings.com/v1/locations/" + LOCATION_ID + "/latest-samples",
      null, tok, function (err2, payload) {
        if (err2) { done(err2, null); return; }
        if (!payload || !payload.devices) { done("The API sent no devices", null); return; }
        var out = [];
        for (var i = 0; i < payload.devices.length; i++) {
          var dev = payload.devices[i];
          if (SERIALS.indexOf(dev.id) < 0) { continue; }
          out.push({ serial: dev.id, name: nameOf(dev.id), data: dev.data || {} });
        }
        done(null, out);
      });
  });
}

/** Twenty four hours of history for one sensor. */
function loadHistory(serial, done) {
  if (DATA_URL) {
    request("GET", DATA_URL + "?api=history&serial=" + serial + "&hours=24", null, null,
      function (err, payload) {
        if (err) { done(err, null); return; }
        done(null, payload && payload.data ? payload.data : null);
      });
    return;
  }
  var to = Math.floor(Date.now() / 1000);
  var from = to - 86400;
  withToken(function (err, tok) {
    if (err) { done(err, null); return; }
    request("GET", "https://ext-api.airthings.com/v1/devices/" + serial +
      "/samples?start=" + from + "&end=" + to, null, tok, function (err2, payload) {
        if (err2) { done(err2, null); return; }
        done(null, payload && payload.data ? payload.data : null);
      });
  });
}

/** History for several sensors, one after another so the player is never flooded. */
function loadHistories(serials, done) {
  var results = [];
  var index = 0;
  function next() {
    if (index >= serials.length) { done(results); return; }
    var serial = serials[index];
    index++;
    loadHistory(serial, function (err, data) {
      if (!err && data) { results.push(data); }
      next();
    });
  }
  next();
}

/* =========================================================================
 * CHART - a row of absolutely positioned divs, so no SVG is needed
 * ====================================================================== */
var CHART_COLUMNS = 100;

/** Reduce one or more sample series to a fixed number of averaged columns. */
function bucket(seriesList, key) {
  var columns = [];
  var c;
  for (c = 0; c < CHART_COLUMNS; c++) { columns.push({ sum: 0, count: 0 }); }

  for (var s = 0; s < seriesList.length; s++) {
    var values = seriesList[s] ? seriesList[s][key] : null;
    if (!values || !values.length) { continue; }
    var clean = [];
    for (var i = 0; i < values.length; i++) {
      if (values[i] === null || values[i] === undefined) { continue; }
      var v = Number(values[i]);
      if (!isNaN(v)) { clean.push(v); }
    }
    if (!clean.length) { continue; }
    var step = clean.length / CHART_COLUMNS;
    for (c = 0; c < CHART_COLUMNS; c++) {
      var start = Math.floor(c * step);
      var end = Math.floor((c + 1) * step);
      if (end <= start) { end = start + 1; }
      for (var p = start; p < end && p < clean.length; p++) {
        columns[c].sum += clean[p];
        columns[c].count++;
      }
    }
  }

  var out = [];
  for (c = 0; c < CHART_COLUMNS; c++) {
    out.push(columns[c].count ? columns[c].sum / columns[c].count : null);
  }
  return out;
}

/** Paint bucketed values into a chart div of the given pixel size. */
function paintBars(elementId, values, key, width, height) {
  var box = byId(elementId);
  if (!box) { return null; }
  var present = [];
  var i;
  for (i = 0; i < values.length; i++) { if (values[i] !== null) { present.push(values[i]); } }
  if (!present.length) { box.innerHTML = ""; return null; }

  var low = present[0], high = present[0], total = 0;
  for (i = 0; i < present.length; i++) {
    if (present[i] < low) { low = present[i]; }
    if (present[i] > high) { high = present[i]; }
    total += present[i];
  }
  var span = high - low;
  if (span < 1) { span = 1; }

  var barWidth = Math.floor(width / values.length);
  if (barWidth < 2) { barWidth = 2; }
  var gap = Math.floor(width / values.length);
  var html = "";
  for (i = 0; i < values.length; i++) {
    if (values[i] === null) { continue; }
    var barHeight = Math.round(((values[i] - low) / span) * (height - 18)) + 4;
    html += '<div class="bar" style="left:' + (i * gap) + "px;width:" + (barWidth - 2) +
      "px;height:" + barHeight + "px;background:" + colourOf(statusOf(key, values[i])) + ';"></div>';
  }
  box.innerHTML = html;
  return { low: low, high: high, average: total / present.length, count: present.length };
}


/* =========================================================================
 * WALL SCREEN, 1920 x 1080
 * Cycles: a summary of each floor, then each space on that floor.
 * ====================================================================== */
var HERO_KEY = "co2";
var TILE_KEYS = ["temp", "humidity", "voc", "pm25", "pm1", "pm10", "sla", "virusRisk", "airExchangeRate"];

var rooms = [];          /* current readings, in display order */
var slides = [];
var slideIndex = 0;
var dwellLeft = DWELL_SECONDS;
var failures = 0;
var lastReadingAt = 0;
var historyCache = {};   /* serial -> bucketed values for the hero metric */

function showAlert(message) {
  var box = byId("alert");
  if (!message) { box.style.display = "none"; box.innerHTML = ""; return; }
  box.innerHTML = message;
  box.style.display = "block";
}

function floorsInOrder() {
  var seen = [], out = [];
  for (var i = 0; i < DEVICES.length; i++) {
    if (seen.indexOf(DEVICES[i].f) < 0) { seen.push(DEVICES[i].f); out.push(DEVICES[i].f); }
  }
  return out;
}

function roomsOnFloor(floor) {
  var out = [];
  for (var i = 0; i < rooms.length; i++) { if (rooms[i].floor === floor) { out.push(rooms[i]); } }
  return out;
}

function buildSlides() {
  var list = [];
  var floors = floorsInOrder();
  for (var f = 0; f < floors.length; f++) {
    var onFloor = roomsOnFloor(floors[f]);
    if (!onFloor.length) { continue; }
    if (onFloor.length > 1) { list.push({ type: "floor", floor: floors[f] }); }
    for (var r = 0; r < onFloor.length; r++) {
      list.push({ type: "room", serial: onFloor[r].serial, floor: floors[f] });
    }
  }
  return list;
}

function roomBySerial(serial) {
  for (var i = 0; i < rooms.length; i++) { if (rooms[i].serial === serial) { return rooms[i]; } }
  return null;
}

/* ---------- one space ---------- */
function paintRoomSlide(room) {
  var data = room.data || {};
  var heroMetric = metricFor(HERO_KEY);
  var age = data.time ? Math.floor(Date.now() / 1000) - data.time : null;
  var stale = (age === null || age > 1200);
  var state = worstOf(data);

  var html = '<div class="title">' + room.name + "</div>" +
    '<div class="meta">Airthings ' + room.serial + " &middot; reading " + ago(age) + "</div>" +
    '<div class="tag">' + room.floor.toUpperCase() + "</div>" +
    '<div class="state ' + (stale ? "dorm" : toneOf(state)) + '">' + wordOf(state, stale) + "</div>" +
    '<div class="stateSub">AIR QUALITY</div>' +
    '<div class="hero">' +
      '<div class="heroLabel">CO2 OVER 24 HOURS</div>' +
      '<div class="heroValue ' + statusOf(HERO_KEY, data[HERO_KEY]) + '">' +
        fmt(data[HERO_KEY], heroMetric) + ' <span class="u">' + heroMetric.unit + "</span></div>" +
      '<div class="heroStats" id="heroStats">reading history</div>' +
      '<div class="chart" id="chart"></div>' +
    "</div>";

  /* Nine tiles, three across by three down, to the right of the chart. */
  var shown = 0;
  for (var i = 0; i < TILE_KEYS.length && shown < 9; i++) {
    var key = TILE_KEYS[i];
    if (data[key] === null || data[key] === undefined) { continue; }
    var m = metricFor(key);
    var column = shown % 3;
    var row = Math.floor(shown / 3);
    html += '<div class="tile" style="left:' + (1000 + column * 300) + "px;top:" +
      (216 + row * 218) + 'px;">' +
      '<div class="tileLab">' + m.label + "</div>" +
      '<div class="tileVal ' + statusOf(key, data[key]) + '">' + fmt(data[key], m) +
      (m.unit ? ' <span class="tileUnit">' + m.unit + "</span>" : "") + "</div></div>";
    shown++;
  }

  byId("stage").innerHTML = html;

  /* The chart comes from cached history, refreshed in the background. */
  var cached = historyCache[room.serial];
  if (cached) {
    var stats = paintBars("chart", cached, HERO_KEY, 900, 300);
    if (stats) {
      byId("heroStats").innerHTML = "low " + fmt(stats.low, heroMetric) +
        "&nbsp;&nbsp;high " + fmt(stats.high, heroMetric) +
        "&nbsp;&nbsp;average " + fmt(stats.average, heroMetric);
    }
  } else {
    byId("heroStats").innerHTML = "reading history";
    loadHistory(room.serial, function (err, data2) {
      if (err || !data2) {
        if (byId("heroStats")) { byId("heroStats").innerHTML = "History unavailable"; }
        return;
      }
      historyCache[room.serial] = bucket([data2], HERO_KEY);
      /* Only paint if this space is still the one on screen. */
      var current = slides[slideIndex];
      if (current && current.type === "room" && current.serial === room.serial) {
        paintRoomSlide(room);
      }
    });
  }
}

/* ---------- one floor ---------- */
function paintFloorSlide(floor) {
  var onFloor = roomsOnFloor(floor);
  var heroMetric = metricFor(HERO_KEY);
  var flagged = 0, i;
  for (i = 0; i < onFloor.length; i++) {
    var s = worstOf(onFloor[i].data || {});
    if (s === "fair" || s === "poor") { flagged++; }
  }

  var html = '<div class="title">' + floor + "</div>" +
    '<div class="meta">' + onFloor.length + (onFloor.length === 1 ? " space" : " spaces") +
    " &middot; " + (flagged ? flagged + " needing attention" : "all within guidance") + "</div>" +
    '<div class="state">' + heroMetric.label + "</div>" +
    '<div class="stateSub">SHOWN PER SPACE</div>';

  /* Cards, four across. Fewer spaces means bigger cards. */
  var big = onFloor.length <= 4;
  var compact = onFloor.length > 8;
  var pitch = big ? 0 : (compact ? 224 : 268);
  var firstRow = big ? 300 : 216;
  var size = big ? " big" : (compact ? " compact" : "");

  for (i = 0; i < onFloor.length && i < 12; i++) {
    var room = onFloor[i];
    var data = room.data || {};
    var age = data.time ? Math.floor(Date.now() / 1000) - data.time : null;
    var stale = (age === null || age > 1200);
    var state = worstOf(data);
    var column = i % 4;
    var row = Math.floor(i / 4);
    html += '<div class="card' + size + " " + (stale ? "dorm" : toneOf(state)) + '" style="left:' +
      (40 + column * 468) + "px;top:" + (firstRow + row * pitch) + 'px;">' +
      '<div class="cardName">' + room.name + "</div>" +
      '<div class="cardVal ' + statusOf(HERO_KEY, data[HERO_KEY]) + '">' +
        fmt(data[HERO_KEY], heroMetric) + ' <span class="u">' + heroMetric.unit + "</span></div>" +
      '<div class="cardLine">' +
        (data.temp !== undefined ? "Temp " + fmt(data.temp, metricFor("temp")) + "&deg;C&nbsp;&nbsp;" : "") +
        (data.humidity !== undefined ? "Humidity " + fmt(data.humidity, metricFor("humidity")) + "%" : "") +
      "</div>" +
      '<div class="cardState ' + (stale ? "dorm" : toneOf(state)) + '">' +
        wordOf(state, stale) + " &middot; " + ago(age) + "</div>" +
      "</div>";
  }

  byId("stage").innerHTML = html;
}

function showSlide(index) {
  if (!slides.length) {
    byId("stage").innerHTML = '<div class="title">Waiting for sensor data</div>' +
      '<div class="meta">The screen will fill in as soon as readings arrive.</div>';
    byId("footLeft").innerHTML = "";
    byId("footRight").innerHTML = "";
    return;
  }
  slideIndex = index;
  var slide = slides[index];
  if (slide.type === "room") {
    var room = roomBySerial(slide.serial);
    if (!room) { return; }
    paintRoomSlide(room);
  } else {
    paintFloorSlide(slide.floor);
  }

  /* Position counter and the name of the next screen. */
  var roomCount = 0, roomPosition = 0;
  for (var i = 0; i < slides.length; i++) {
    if (slides[i].type !== "room") { continue; }
    roomCount++;
    if (i === index) { roomPosition = roomCount; }
  }
  byId("footLeft").innerHTML = slide.type === "room"
    ? "Space " + roomPosition + " of " + roomCount
    : "Floor summary &middot; " + slide.floor;

  var next = slides[(index + 1) % slides.length];
  byId("footRight").innerHTML = "Next <b>" +
    (next.type === "room" ? nameOf(next.serial) : next.floor) + "</b>";
}

function advance() {
  if (!slides.length) { return; }
  showSlide((slideIndex + 1) % slides.length);
  dwellLeft = DWELL_SECONDS;
}

function tick() {
  var now = new Date();
  byId("clock").innerHTML = pad2(now.getHours()) + ":" + pad2(now.getMinutes());
  if (lastReadingAt) {
    byId("live").innerHTML = "Live from Airthings &middot; <b>" +
      ago(Math.floor((Date.now() - lastReadingAt) / 1000)) + "</b>";
  }
  if (!slides.length) { return; }
  dwellLeft--;
  var width = Math.round((1 - (dwellLeft / DWELL_SECONDS)) * 1920);
  byId("progress").style.width = (width < 0 ? 0 : width) + "px";
  if (dwellLeft <= 0) { advance(); }
}

function refresh() {
  loadReadings(function (err, incoming) {
    if (err || !incoming || !incoming.length) {
      failures++;
      var wait = Math.min(120, 15 * failures);
      showAlert("No data from Airthings: " + (err || "no sensors returned") +
        ". Retrying in " + wait + " seconds.");
      setTimeout(refresh, wait * 1000);
      if (!rooms.length) { showSlide(0); }
      return;
    }
    failures = 0;
    showAlert("");
    lastReadingAt = Date.now();

    /* Keep the running order fixed, so a refresh never jumps the cycle. */
    var ordered = [];
    for (var d = 0; d < DEVICES.length; d++) {
      for (var i = 0; i < incoming.length; i++) {
        if (incoming[i].serial === DEVICES[d].s) {
          incoming[i].floor = DEVICES[d].f;
          incoming[i].name = DEVICES[d].n;
          ordered.push(incoming[i]);
        }
      }
    }
    rooms = ordered;

    var wasOn = slides.length ? slides[slideIndex] : null;
    slides = buildSlides();
    var keep = 0;
    if (wasOn) {
      for (var s = 0; s < slides.length; s++) {
        if (wasOn.type === "room" && slides[s].type === "room" && slides[s].serial === wasOn.serial) { keep = s; }
        if (wasOn.type === "floor" && slides[s].type === "floor" && slides[s].floor === wasOn.floor) { keep = s; }
      }
    }
    showSlide(keep);

    /* Charts are cached per sensor; drop them so trends stay current. */
    historyCache = {};
    setTimeout(refresh, REFRESH_MS);
  });
}

tick();
setInterval(tick, 1000);
refresh();

/* A screen left running for weeks benefits from an occasional clean start.
   The meta refresh in the head does the same job if scripting is interrupted. */
setTimeout(function () { window.location.reload(true); }, RELOAD_HOURS * 3600000);

</script>
</body>
</html>
